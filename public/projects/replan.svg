<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <rect width="800" height="500" rx="16" fill="#e8ecf0"/>
  <!-- Map texture background -->
  <g transform="translate(60, 40)">
    <rect width="680" height="420" rx="12" fill="#dbe6f0" stroke="#cad8e8" stroke-width="2"/>
    <!-- Topo map contour lines -->
    <path d="M 50 100 Q 150 40 250 120 T 450 100 T 650 180" stroke="#b8cbdc" stroke-width="2" fill="none" stroke-dasharray="6,6"/>
    <path d="M 20 200 Q 180 140 320 220 T 520 200 T 660 300" stroke="#b8cbdc" stroke-width="2" fill="none"/>
    
    <!-- Japan map shape outline -->
    <path d="M 400 80 Q 430 120 410 180 T 360 260 T 310 320 T 260 360" stroke="#507090" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 460 60 Q 480 80 470 100" stroke="#507090" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Red pushpins and pins -->
    <!-- Tokyo -->
    <circle cx="410" cy="180" r="10" fill="#e63946"/>
    <circle cx="410" cy="180" r="4" fill="#ffffff"/>
    <rect x="424" y="168" width="60" height="24" rx="4" fill="#ffffff" stroke="#e63946" stroke-width="1.5"/>
    <text x="432" y="184" font-family="sans-serif" font-size="11" font-weight="700" fill="#1d3557">Tokyo</text>

    <!-- Kyoto -->
    <circle cx="360" cy="240" r="10" fill="#e63946"/>
    <circle cx="360" cy="240" r="4" fill="#ffffff"/>
    <rect x="290" y="228" width="60" height="24" rx="4" fill="#ffffff" stroke="#e63946" stroke-width="1.5"/>
    <text x="300" y="244" font-family="sans-serif" font-size="11" font-weight="700" fill="#1d3557">Kyoto</text>

    <!-- Osaka -->
    <circle cx="330" cy="270" r="10" fill="#e63946"/>
    <circle cx="330" cy="270" r="4" fill="#ffffff"/>

    <!-- Route dash line -->
    <path d="M 410 180 L 360 240 L 330 270" stroke="#e63946" stroke-width="3" stroke-dasharray="6,4"/>

    <!-- Travel elements on side -->
    <!-- Vintage Camera -->
    <g transform="translate(520, 260)">
      <rect width="110" height="70" rx="8" fill="#2b2d42"/>
      <circle cx="55" cy="35" r="22" fill="#8d99ae" stroke="#edf2f4" stroke-width="3"/>
      <circle cx="55" cy="35" r="14" fill="#111110"/>
      <rect x="80" y="8" width="18" height="8" rx="2" fill="#d90429"/>
    </g>

    <!-- Coffee Mug -->
    <g transform="translate(560, 60)">
      <circle cx="40" cy="40" r="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
      <circle cx="40" cy="40" r="24" fill="#6c584c"/>
    </g>
  </g>
</svg>
