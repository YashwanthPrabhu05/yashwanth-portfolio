<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <rect width="800" height="500" rx="16" fill="#f4f4f0"/>
  <!-- Canvas background -->
  <g transform="translate(40, 40)">
    <!-- Board columns -->
    <!-- Column 1: To Do -->
    <rect x="0" y="0" width="160" height="420" rx="10" fill="#ffffff" stroke="#e4e4de" stroke-width="1.5"/>
    <text x="16" y="32" font-family="sans-serif" font-size="14" font-weight="600" fill="#555550">To Do</text>
    <rect x="12" y="50" width="136" height="70" rx="6" fill="#fafafa" stroke="#eeeeea"/>
    <rect x="24" y="66" width="90" height="8" rx="4" fill="#d0d0c8"/>
    <rect x="24" y="82" width="60" height="6" rx="3" fill="#e8e8e0"/>
    <circle cx="130" cy="100" r="10" fill="#c4782a" opacity="0.8"/>
    
    <rect x="12" y="130" width="136" height="70" rx="6" fill="#fafafa" stroke="#eeeeea"/>
    <rect x="24" y="146" width="80" height="8" rx="4" fill="#d0d0c8"/>
    <rect x="24" y="162" width="50" height="6" rx="3" fill="#e8e8e0"/>

    <!-- Column 2: In Progress -->
    <rect x="180" y="0" width="160" height="420" rx="10" fill="#ffffff" stroke="#e4e4de" stroke-width="1.5"/>
    <text x="196" y="32" font-family="sans-serif" font-size="14" font-weight="600" fill="#333330">In Progress</text>
    <rect x="192" y="50" width="136" height="90" rx="6" fill="#fff9f0" stroke="#f0e0c8"/>
    <rect x="204" y="66" width="100" height="8" rx="4" fill="#c4782a"/>
    <rect x="204" y="82" width="70" height="6" rx="3" fill="#e4b078"/>
    <rect x="204" y="110" width="40" height="16" rx="8" fill="#ffeacc"/>
    <text x="212" y="122" font-family="sans-serif" font-size="10" font-weight="600" fill="#c4782a">AI Bot</text>

    <!-- Column 3: Review -->
    <rect x="360" y="0" width="160" height="420" rx="10" fill="#ffffff" stroke="#e4e4de" stroke-width="1.5"/>
    <text x="376" y="32" font-family="sans-serif" font-size="14" font-weight="600" fill="#555550">Review</text>
    <rect x="372" y="50" width="136" height="80" rx="6" fill="#fafafa" stroke="#eeeeea"/>
    <rect x="384" y="66" width="95" height="8" rx="4" fill="#b0b0a8"/>
    <rect x="384" y="82" width="65" height="6" rx="3" fill="#e0e0d8"/>

    <!-- Column 4: Done -->
    <rect x="540" y="0" width="160" height="420" rx="10" fill="#ffffff" stroke="#e4e4de" stroke-width="1.5"/>
    <text x="556" y="32" font-family="sans-serif" font-size="14" font-weight="600" fill="#2d7d46">Done</text>
    <rect x="552" y="50" width="136" height="70" rx="6" fill="#f0faf4" stroke="#d0ebd8"/>
    <rect x="564" y="66" width="85" height="8" rx="4" fill="#48a666"/>
    <rect x="564" y="82" width="55" height="6" rx="3" fill="#a4d8b4"/>
  </g>
</svg>
